<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Travel recommendations tailored to your preferences by Claude AI.">
    <title>Where to go on vacation?</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main>
        <header class="page-header">
            <span class="eyebrow">Travel recommendations</span>
            <h1>Where to go on vacation?</h1>
            <p class="lead">
                Answer six questions and Claude will match a destination
                to your preferences, budget and season.
            </p>
        </header>

        <form method="POST" autocomplete="on">
            <label class="field">
                <span class="field-label">
                    <strong>Continent</strong>
                </span>
                <select name="continent" aria-label="Select continent">
                    <option value="any">Any</option>
                    {% for c in continents %}
                        <option value="{{ c }}"
                            {% if form_data and form_data.continent == c %}selected{% endif %}>
                            {{ c }}
                        </option>
                    {% endfor %}
                </select>
            </label>

            <label class="field">
                <span class="field-label">
                    <strong>Country</strong>
                </span>
                <select name="country" aria-label="Select country">
                    <option value="any">Any</option>
                    {% for c in countries %}
                        <option value="{{ c }}"
                            {% if form_data and form_data.country == c %}selected{% endif %}>
                            {{ c }}
                        </option>
                    {% endfor %}
                </select>
            </label>

            <label class="field">
                <span class="field-label">
                    <strong>Attraction type</strong>
                </span>
                <select name="type" aria-label="Select attraction type">
                    <option value="any">Any</option>
                    {% for t in types %}
                        <option value="{{ t }}"
                            {% if form_data and form_data.type == t %}selected{% endif %}>
                            {{ t }}
                        </option>
                    {% endfor %}
                </select>
            </label>

            <label class="field">
                <span class="field-label">
                    <strong>Season</strong>
                </span>
                <select name="season" aria-label="Select season">
                    <option value="any">Any</option>
                    {% for s in seasons %}
                        <option value="{{ s }}"
                            {% if form_data and form_data.season == s %}selected{% endif %}>
                            {{ s }}
                        </option>
                    {% endfor %}
                </select>
            </label>

            <label class="field">
                <span class="field-label">
                    <strong>Budget</strong>
                    <span>Per person, total</span>
                </span>
                <select name="budget" aria-label="Select budget">
                    <option value="any">Any</option>
                    <option value="low"
                        {% if form_data and form_data.budget == 'low' %}selected{% endif %}>
                        Low - up to 100 USD
                    </option>
                    <option value="medium"
                        {% if form_data and form_data.budget == 'medium' %}selected{% endif %}>
                        Medium - 100 to 200 USD
                    </option>
                    <option value="high"
                        {% if form_data and form_data.budget == 'high' %}selected{% endif %}>
                        High - above 200 USD
                    </option>
                </select>
            </label>

            <label class="field">
                <span class="field-label">
                    <strong>UNESCO list</strong>
                </span>
                <select name="unesco" aria-label="Select UNESCO filter">
                    <option value="any">Doesn't matter</option>
                    <option value="yes"
                        {% if form_data and form_data.unesco == 'yes' %}selected{% endif %}>
                        Only UNESCO sites
                    </option>
                </select>
            </label>

            <label class="field">
                <span class="field-label">
                    <strong>Additional context</strong>
                    <span>Optional, max 500 characters</span>
                </span>
                <textarea name="context" rows="3" maxlength="500"
                    aria-label="Additional context for Claude"
                    placeholder="E.g. traveling with a child, I dislike crowds, I'm afraid of heights..."
                >{{ form_data.context if form_data else '' }}</textarea>
                <small class="hint">
                    Limit: 5 requests per hour, 20 per day.
                </small>
            </label>

            <div class="actions">
                <button type="submit">Suggest a destination</button>
            </div>
        </form>
    </main>
</body>
</html>
